<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Authentication Test</h1>
    
    <h2>Register New User</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="regName" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="regPassword" required>
        </div>
        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" id="regConfirmPassword" required>
        </div>
        <button type="submit">Register</button>
    </form>

    <h2>Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="loginPassword" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <div id="result"></div>

    <script>
        const API_URL = 'https://election-backend-success-1040323285919.us-central1.run.app/api';
        
        function showResult(message, isSuccess = true) {
            const result = document.getElementById('result');
            result.innerHTML = message;
            result.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showResult('Passwords do not match', false);
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Registration successful! Welcome ${data.data.user.name}! Token: ${data.data.token.substring(0, 20)}...`);
                } else {
                    showResult(`❌ Registration failed: ${data.error?.message || 'Unknown error'}`, false);
                }
            } catch (error) {
                showResult(`❌ Network error: ${error.message}`, false);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Login successful! Welcome back ${data.data.user.name}! Token: ${data.data.token.substring(0, 20)}...`);
                } else {
                    showResult(`❌ Login failed: ${data.error?.message || 'Unknown error'}`, false);
                }
            } catch (error) {
                showResult(`❌ Network error: ${error.message}`, false);
            }
        });
    </script>
</body>
</html>
