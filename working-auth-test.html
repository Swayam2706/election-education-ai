<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0056b3; }
        button.google { background: #db4437; }
        button.google:hover { background: #c23321; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🔐 Complete Authentication Test</h1>
    
    <div class="section">
        <h2>📧 Email/Password Registration</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" id="regName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="regEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password (min 8 characters):</label>
                <input type="password" id="regPassword" required placeholder="Enter password (8+ characters)">
            </div>
            <div class="form-group">
                <label>Confirm Password:</label>
                <input type="password" id="regConfirmPassword" required placeholder="Confirm your password">
            </div>
            <button type="submit">Register with Email</button>
        </form>
    </div>

    <div class="section">
        <h2>🔑 Email/Password Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="loginEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="loginPassword" required placeholder="Enter your password">
            </div>
            <button type="submit">Login with Email</button>
        </form>
    </div>

    <div class="section">
        <h2>🔥 Firebase Google Sign-In</h2>
        <p>Test Google authentication with Firebase:</p>
        <button id="googleSignIn" class="google">Continue with Google</button>
        <button id="googleSignOut" style="background: #6c757d;">Sign Out</button>
    </div>

    <div id="result"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB0-pGjIEZQM1p-rT-np3pBJeRajKYJxP4",
            authDomain: "electioneducation-c8ea3.firebaseapp.com",
            projectId: "electioneducation-c8ea3",
            storageBucket: "electioneducation-c8ea3.firebasestorage.app",
            messagingSenderId: "173580043913",
            appId: "1:173580043913:web:48508d94c0ef6b5ba92858",
            measurementId: "G-38G1QNP6H7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.addScope('email');
        googleProvider.addScope('profile');

        const API_URL = 'https://election-backend-success-1040323285919.us-central1.run.app/api';
        
        function showResult(message, isSuccess = true) {
            const result = document.getElementById('result');
            result.innerHTML = message;
            result.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        // Email Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (password !== confirmPassword) {
                showResult('❌ Passwords do not match', false);
                return;
            }

            if (password.length < 8) {
                showResult('❌ Password must be at least 8 characters long', false);
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        confirmPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Registration successful! Welcome ${data.data.user.name}!<br>Token: ${data.data.token.substring(0, 30)}...`);
                } else {
                    showResult(`❌ Registration failed: ${data.error?.message || 'Unknown error'}`, false);
                }
            } catch (error) {
                showResult(`❌ Network error: ${error.message}`, false);
            }
        });

        // Email Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(`✅ Login successful! Welcome back ${data.data.user.name}!<br>Token: ${data.data.token.substring(0, 30)}...`);
                } else {
                    showResult(`❌ Login failed: ${data.error?.message || 'Unknown error'}`, false);
                }
            } catch (error) {
                showResult(`❌ Network error: ${error.message}`, false);
            }
        });

        // Google Sign-In
        document.getElementById('googleSignIn').addEventListener('click', async () => {
            try {
                showResult('🔄 Signing in with Google...', true);
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                const token = await user.getIdToken();

                // Sync with backend
                const response = await fetch(`${API_URL}/auth/firebase-sync`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        firebaseUid: user.uid,
                        email: user.email,
                        name: user.displayName || 'User',
                        image: user.photoURL,
                        token: token
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(`✅ Google Sign-In successful! Welcome ${data.data.user.name}!<br>Email: ${data.data.user.email}<br>Token: ${data.data.token.substring(0, 30)}...`);
                } else {
                    showResult(`❌ Backend sync failed: ${data.error?.message || 'Unknown error'}`, false);
                }
            } catch (error) {
                console.error('Google sign-in error:', error);
                showResult(`❌ Google Sign-In failed: ${error.message}`, false);
            }
        });

        // Google Sign-Out
        document.getElementById('googleSignOut').addEventListener('click', async () => {
            try {
                await signOut(auth);
                showResult('✅ Signed out successfully');
            } catch (error) {
                showResult(`❌ Sign-out failed: ${error.message}`, false);
            }
        });

        // Auth state listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('User signed in:', user.email);
            } else {
                console.log('User signed out');
            }
        });

        // Initial message
        showResult('🚀 Authentication system ready. Try registering, logging in, or using Google Sign-In above.');
    </script>
</body>
</html>
