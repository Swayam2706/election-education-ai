# Google Cloud Build configuration for automated deployment
# This file defines how to build and deploy both frontend and backend services

steps:
  # Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-backend:latest'
      - './backend'
    waitFor: ['-']

  # Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-frontend:latest'
      - '--build-arg'
      - 'REACT_APP_API_URL=${_BACKEND_URL}'
      - './frontend'
    waitFor: ['-']

  # Push Backend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/election-backend:$COMMIT_SHA'
    waitFor: ['build-backend']

  # Push Frontend Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/election-frontend:$COMMIT_SHA'
    waitFor: ['build-frontend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'election-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/election-backend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production'
    waitFor: ['push-backend']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'election-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/election-frontend:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    waitFor: ['push-frontend']

# Substitution variables (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _BACKEND_URL: 'https://election-backend-XXXXXXXXXX-uc.a.run.app/api'

# Images to be pushed to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/election-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/election-backend:latest'
  - 'gcr.io/$PROJECT_ID/election-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/election-frontend:latest'

# Build timeout
timeout: '1800s'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
