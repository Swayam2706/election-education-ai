name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run security audit
        run: |
          cd backend && npm audit --audit-level=moderate
          cd ../frontend && npm audit --audit-level=moderate

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd backend && npm ci
        
      - name: Run tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret
          
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
        
      - name: Run tests
        run: cd frontend && npm test -- --coverage --watchAll=false
        
      - name: Build
        run: cd frontend && npm run build

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          cd frontend && npm ci --legacy-peer-deps
          npx playwright install --with-deps
          
      - name: Run E2E tests
        run: npx playwright test
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps
        
      - name: Build
        run: cd frontend && npm run build
        
      - name: Run accessibility tests
        run: |
          cd frontend
          npx serve -s build -l 3000 &
          sleep 5
          npx pa11y-ci --sitemap http://localhost:3000/sitemap.xml

  deploy:
    name: Deploy to Production
    needs: [security-scan, backend-tests, frontend-tests, e2e-tests, accessibility-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      - name: Deploy Backend
        run: |
          gcloud run deploy election-backend-success \
            --source backend \
            --region us-central1 \
            --allow-unauthenticated
            
      - name: Build Frontend
        run: cd frontend && npm ci --legacy-peer-deps && npm run build
        
      - name: Deploy Frontend
        run: |
          gcloud run deploy election-frontend-absolutely-final \
            --source frontend \
            --region us-central1 \
            --allow-unauthenticated
